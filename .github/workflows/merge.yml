name: Merge Candidates

# 把 LLM 产出的候选曲目 JSON 上传到 candidates/ 目录（GitHub 网页 Add file 即可），
# 本 workflow 自动：iTunes 验真 + 去重 + 打标签 → 写进 pool.json → 清除候选文件 → 提交。
# 提交 pool.json 会触发 daily.yml（push main）重新构建并部署，新曲随下一期生效。
on:
  push:
    branches: [main]
    paths: ["candidates/**.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-candidates
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 验真 + 去重 + 合并进 pool
        run: python3 scripts/merge_candidates.py

      - name: 回写 pool（触发重新部署）
        run: |
          git config user.name "music-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pool.json data/itunes_cache.json candidates/
          if git diff --cached --quiet; then
            echo "无新增（候选为空/全部重复或验不到），跳过提交"
          else
            git commit -m "chore: 合并候选新曲 $(date -u +%F)"
            git push
          fi
