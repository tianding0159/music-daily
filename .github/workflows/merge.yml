name: Merge Candidates

# 把 LLM 产出的候选 JSON 传到 candidates/（GitHub 网页 Add file 即可），本 workflow：
# schema 校验 → iTunes 精确版本匹配 → 去重 → 入库 → quarantine 落盘 → 合并报告 → 提交。
# transient_error（网络/限流）时脚本非零退出 → 合并/提交步骤跳过 → 候选保留待下次重试。
# 入库后不立即发日报；新曲随下一次每天 08:11 的 daily 自然生效（与 daily 解耦）。
on:
  push:
    branches: [main]
    paths: ["candidates/**.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-candidates
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # 60min：每周补库单文件最多 225 首，iTunes 限流约 3s/次、最坏 US+JP 各查一次
    # ≈ 225×2×3s ≈ 22.5min，留足余量（transient 是 fail-closed 立即退出，不靠重试撑时间）。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 + 精确验真 + 去重 + 合并（transient 时非零退出→后续跳过、候选保留）
        id: merge
        run: |
          set +e
          python3 scripts/merge_candidates.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          # 退出码交给后面的通知步骤解释；这里先不判生死，
          # 否则 if: always() 之外的步骤会被跳过、连"回写"都不会尝试
          exit 0

      - name: 回写 pool / quarantine / 报告（仅合并成功时）
        if: steps.merge.outputs.rc == '0'
        run: |
          git config user.name "music-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/artists.json 必须在列 —— merge_candidates 的 _apply_bios 会写它
          # （补库与简介合成一次交付后新增的行为）。漏掉的话简介只写到 runner 磁盘、
          # 随容器蒸发：合并成功、微信报「+N 首」、Actions 全绿，但库里永远补不上，
          # 下次同一位艺人又被判「新艺人缺简介」。静默得非常彻底。
          git add data/pool.json data/artists.json data/itunes_cache.json \
                  candidates/ quarantine/ reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更（候选为空/全部隔离），跳过提交"
          else
            git commit -m "chore: 合并候选 $(date -u +%F)"
            git push
          fi

      # 定时补库跑在 GPT 那边、无人值守：失败必须主动告知，
      # 否则「候选被拒 → 池子停止增长」能静默持续好几周（原来这里完全没有通知）。
      - name: 推微信告知结果（成功报数 / 失败报原因）
        if: always()
        env:
          WECHAT_PUSH_KEY: ${{ secrets.WECHAT_PUSH_KEY }}
          WECHAT_PUSH_PROVIDER: ${{ vars.WECHAT_PUSH_PROVIDER }}
        run: python3 scripts/notify_merge.py "${{ steps.merge.outputs.rc }}"

      # 通知发完再让 job 反映真实结果，这样 Actions 页面的红/绿仍然可信
      - name: 按合并退出码决定 job 成败
        if: always()
        run: |
          rc="${{ steps.merge.outputs.rc }}"
          [ "$rc" = "0" ] && { echo "合并成功"; exit 0; }
          echo "::error::merge_candidates 退出码 $rc —— 候选已保留，见上方日志"
          exit 1
