name: Daily Music Report

# 每天北京时间早 8:00 更新（UTC 0:00，+11min 错峰避 GitHub schedule 高峰延迟）。
# 只由定时或手动触发（已与候选合并解耦：普通 push/候选入库不触发日报）。
on:
  schedule:
    - cron: "11 0 * * *"   # 北京 08:11（UTC 00:11）
    - cron: "41 0 * * *"   # 北京 08:41 备份
    - cron: "7 1 * * *"    # 北京 09:07 备份
    - cron: "31 1 * * *"   # 北京 09:31 备份（四槽全被 GitHub 跳过概率极低；已建当期 notify 幂等跳过、不重发微信）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # 与 publish-site.yml 共用一个 group —— 同 group 跨 workflow 也串行，
  # 避免两条链路同时 deploy 到 github-pages 互相覆盖。
  # 这个 group 同时仍然拦住「四个 cron 槽位彼此重叠」（原 daily-music 的作用）。
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建日报（选曲 / 写 issue 快照 / 从快照重建 site；此处不推送微信）
        run: python3 scripts/build_daily.py --theme grid

      - name: 回写状态到 repo（history / issue 快照 / latest / iTunes 缓存 / site）
        run: |
          git config user.name "music-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/issues data/latest.json data/itunes_cache.json site
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 日报 $(date -u +%F) [skip ci]"
            # 裸 push 顶不住分支移动：手动 dispatch 与定时槽位若前后脚跑，
            # 或人在本地刚推过，后完成的这次就会被 "fetch first" 拒掉、整条 run 判失败。
            # 回写内容都是可重放的构建产物，rebase 重试即可。
            for i in 1 2 3 4 5; do
              if git push; then echo "回写成功（第 $i 次）"; exit 0; fi
              echo "push 被拒，rebase 后重试（第 $i 次）"
              git pull --rebase --autostash origin main || exit 1
              sleep $((i * 3))
            done
            echo "::error::回写重试 5 次仍失败"; exit 1
          fi

      - name: 打包 site/ 为 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 部署后校验 + 微信通知（页面 200 才发；部署失败则本步失败、不发"已更新"）
        env:
          WECHAT_PUSH_KEY: ${{ secrets.WECHAT_PUSH_KEY }}
          WECHAT_PUSH_PROVIDER: ${{ vars.WECHAT_PUSH_PROVIDER }}
        run: python3 scripts/notify_after_deploy.py "${{ steps.deploy.outputs.page_url || vars.PAGES_URL }}"
