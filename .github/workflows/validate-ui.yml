name: Validate UI and catalog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline regressions
        run: |
          python3 tests/test_catalog.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild without changing issue state
        run: |
          python3 scripts/build_daily.py --render-only
          ./tools/check_site_assets.sh
          git diff --exit-code -- data/pool.json data/history.json data/issues data/latest.json
